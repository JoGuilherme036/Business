# Cloudflare Worker: static site (dist/) + schedule API + realtime hub, with a D1 database.
# The admin password is a secret: set ADMIN_TOKEN in the Worker settings (never here).
name = "velha-guarda-barbearia"
main = "server/worker.ts"
compatibility_date = "2025-06-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "velha-guarda"
database_id = "SUBSTITUA-PELO-ID-DO-SEU-D1" # rode: npx wrangler d1 create velha-guarda
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "HUB"
class_name = "ScheduleHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScheduleHub"]
